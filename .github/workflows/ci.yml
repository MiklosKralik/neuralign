name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: Python ${{ matrix.python }} / ${{ matrix.dependencies }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: "3.10"
            dependencies: minimum
            torch: torch==2.9.1
            numpy: numpy==1.26.0
          - python: "3.11"
            dependencies: latest
            torch: torch>=2.9.1
            numpy: numpy>=1.26
          - python: "3.12"
            dependencies: latest
            torch: torch>=2.9.1
            numpy: numpy>=1.26
          - python: "3.13"
            dependencies: latest
            torch: torch>=2.9.1
            numpy: numpy>=1.26
          - python: "3.14"
            dependencies: latest
            torch: torch>=2.9.1
            numpy: numpy>=1.26
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Build and validate distributions
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check --strict dist/*
      - name: Install the wheel with CPU dependencies
        env:
          TORCH_REQUIREMENT: ${{ matrix.torch }}
          NUMPY_REQUIREMENT: ${{ matrix.numpy }}
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu "$TORCH_REQUIREMENT"
          python -m pip install "$NUMPY_REQUIREMENT" dist/*.whl
          python -m pip check
      - name: Test the installed package
        run: python -I -m unittest discover -s tests -v

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build documentation and check generated files
        run: |
          python -m pip install "markdown-it-py>=3.0"
          python docs/build.py
          git diff --exit-code -- docs
