[project]
name = "neuralign"
version = "0.1.0"
description = "Tensor decomposition methods for aligning neural representations across recording sessions"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "opt-einsum>=3.4.0",
    "torch>=2.9.1",
    "tqdm>=4.67.1",
]

[project.urls]
Repository = "https://github.com/MiklosKralik/neuralign"

[build-system]
requires = ["uv_build >= 0.11.2, <0.12.0"]
build-backend = "uv_build"

[tool.uv]
override-dependencies = [
    "numpy>=2.1; python_version >= '3.13'",
]
