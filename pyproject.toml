[project]
name = "neuralign"
version = "0.1.0"
description = "Joint tensor decomposition and alignment of trial-resolved neural recordings"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Miklós Králik" },
    { name = "Sasha Tinelli" },
    { name = "James Kozloski" },
    { name = "Rui Ponte Costa" },
    { name = "Andrew Sharott" },
    { name = "Robert L. Peach" },
]
keywords = [
    "computational neuroscience",
    "tensor decomposition",
    "neural population dynamics",
    "representation alignment",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.26",
    "opt-einsum>=3.4.0",
    "torch>=2.9.1",
    "tqdm>=4.67.1",
]

[project.optional-dependencies]
examples = ["matplotlib>=3.8"]
docs = ["markdown-it-py>=3.0"]

[project.urls]
Documentation = "https://mikloskralik.github.io/neuralign/"
Repository = "https://github.com/MiklosKralik/neuralign"
Issues = "https://github.com/MiklosKralik/neuralign/issues"
"Manuscript analyses" = "https://github.com/MiklosKralik/neural_tensors"

[build-system]
requires = ["uv_build >= 0.11.2, <0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = ["ruff>=0.12"]

[tool.uv.build-backend]
source-include = ["CITATION.cff", "docs/**", "examples/**", ".github/**"]

